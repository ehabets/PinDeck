title: Ocean
author: PinDeck
version: 1.0.0
quarto-required: ">=1.4.0"
contributes:
  formats:
    revealjs:
      # Ocean's own files: theme.css (may be restyled per talk), quarto.css (Ocean on Quarto's markup),
      # brand.css (the fixed identity, last)
      css: [theme.css, quarto.css, brand.css]
      template-partials: [title-slide.html]
      filters: [ocean.lua]
      include-in-header: header.html
      include-before-body: before-body.html
      include-after-body: after-body.html
      width: 1280
      height: 720
      margin: 0
      min-scale: 0.2
      max-scale: 3
      center: false
      controls: false
      progress: false
      slide-number: false
      menu: false
      hash: true
      navigation-mode: linear
      transition: fade
      transition-speed: fast
      background-transition: none
      pdf-separate-fragments: false
