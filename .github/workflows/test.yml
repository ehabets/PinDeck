# Tests on real Linux and macOS, Node 22 and 24. The tests start PinDeck servers on copies of the example
# deck with a fake claude and codex (test/fixtures/fake-agent): no login, no network, no AI. Screenshots,
# headless layout and PDF export run with the runner's real Chrome.
name: Test

on:
  push:
    branches: [main, "linux-*"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
      - name: Syntax check
        run: for f in server.mjs cli.mjs lib/*.mjs public/*.js; do node --check "$f"; done
      # apt usually takes under a minute here, but a stuck mirror can hang it silently until the job is
      # cancelled. Each attempt gets 150 seconds, then it is killed and tried again on Ubuntu's own archive; after 3 attempts the step
      # fails rather than going on without the tools, since the tests would then skip the PDF, PowerPoint and
      # audio checks and still pass.
      - name: Linux tools for PDF and PowerPoint pictures and audio (Poppler, LibreOffice, ffmpeg)
        if: runner.os == 'Linux'
        timeout-minutes: 9
        run: |
          apt="apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30"
          for attempt in 1 2 3; do
            echo "::group::apt attempt $attempt"
            sudo dpkg --configure -a
            if sudo timeout -k 10 150 sh -c "$apt update && $apt install -y -q --no-install-recommends \
                 poppler-utils ffmpeg libreoffice-impress"; then
              echo "::endgroup::"
              exit 0
            fi
            echo "::endgroup::"
            echo "::warning::apt attempt $attempt failed or hung; apt and dpkg processes still running:"
            ps -eo pid,etime,args | grep -E '[a]pt|[d]pkg' || true
            # The runner's Azure mirror is the usual suspect; later attempts use Ubuntu's own archive.
            sudo sed -i 's#azure\.archive\.ubuntu\.com#archive.ubuntu.com#g' \
              /etc/apt/sources.list.d/ubuntu.sources /etc/apt/sources.list 2>/dev/null || true
            sleep 10
          done
          echo "::error::apt-get failed or hung 3 times; Poppler, LibreOffice and ffmpeg are not installed"
          exit 1
      - name: Find Chrome for the real-Chrome test
        run: |
          for c in "$(command -v google-chrome || true)" "$(command -v chromium || true)" \
                   "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome"; do
            if [ -n "$c" ] && [ -x "$c" ]; then echo "PINDECK_TEST_CHROME=$c" >> "$GITHUB_ENV"; break; fi
          done
      - name: Record the system
        run: |
          uname -srm && node --version && git --version
          echo "Chrome for tests: ${PINDECK_TEST_CHROME:-none}"
      - name: Tests (details printed with each failure; a stuck test fails after 5 minutes)
        run: node --test --test-reporter=tap --test-timeout=300000
