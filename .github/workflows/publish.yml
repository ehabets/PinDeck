# Stages a release on npm when a release tag (vX.Y.Z or vX.Y.Z-beta.N) is pushed. Uses npm trusted publishing (OIDC),
# so no npm token is stored on GitHub. The version goes live only after a maintainer approves it
# with 2FA: on npmjs.com, or `npm stage approve <stage-id>` (the id is in this run's log and `npm stage list`).
name: Stage on npm

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write   # lets npm verify that this workflow did the publishing

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: npm 11.15 or later (for npm stage publish)
        run: npm install -g npm@latest
      - name: Tag matches package.json
        run: test "v$(node -p 'require("./package.json").version')" = "$GITHUB_REF_NAME"
      - name: Syntax check
        run: for f in *.mjs lib/*.mjs public/*.js; do node --check "$f"; done
      # nothing is staged that fails the tests (tools the runner lacks, such as LibreOffice, skip their own)
      - name: Tests
        run: node --test
      - name: Stage on the appropriate npm channel
        run: |
          release_version="$(node -p 'require("./package.json").version')"
          case "$release_version" in
            *-*) npm stage publish --tag beta ;;
            *)   npm stage publish --tag latest ;;
          esac
